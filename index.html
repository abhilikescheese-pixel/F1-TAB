<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>

    <title>MY TAB</title>
</head>

<body>

    <div id="clock-container">
        <div id="clock">00:00:00</div>
    </div>

    <main class="container">

        <section class="search">
            <form method="get" action="https://www.google.com/search">
                <input
                    type="text"
                    name="q"
                    placeholder="Search..."
                >

                <button type="submit">
                    Search
                </button>
            </form>
        </section>

        <section class="buttons">

            <a href="https://hackclub.com/" target="_blank">
                <button type="button">HACKCLUB</button>
            </a>

            <a href="https://youtube.com/" target="_blank">
                <button type="button">YOUTUBE</button>
            </a>

            <a href="https://stardance.hackclub.com/home" target="_blank">
                <button type="button">STARDANCE</button>
            </a>

            <a href="https://slack.com/intl/en-ie/" target="_blank">
                <button type="button">SLACK</button>
            </a>

        </section>

    </main>

</body>
</html>
